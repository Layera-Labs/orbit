# A runnable deployment, and the reference for what the service actually needs.
#
#   docker compose -f services/render/compose.yaml up --build
#
# Run it from the repo root: the build context is `..`/`..` because the service
# is part of a pnpm workspace and cannot be built from its own directory alone.
services:
  render:
    build:
      context: ../..
      dockerfile: services/render/Dockerfile
    ports:
      - "8787:8787"
    environment:
      # REQUIRED. Signs every session and guest token. The image runs with
      # NODE_ENV=production, where the service REFUSES TO START without this
      # rather than inventing one — a guessed secret would make every token
      # forgeable, silently. Generate one with:
      #   node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
      # Changing it signs everybody out, including guests, who have no password
      # to sign back in with and therefore lose their credits. Treat it as
      # permanent.
      ORBIT_JWT_SECRET: ${ORBIT_JWT_SECRET:?set ORBIT_JWT_SECRET — the service will not start without it}

      # Origins allowed to call the service. Unset = any, which is the default
      # because Orbit is an embeddable SDK called from customers' own pages.
      ORBIT_ALLOWED_ORIGINS: ${ORBIT_ALLOWED_ORIGINS:-}

      # Credits and self-hosted accounts. WITHOUT this the ledger is in-memory
      # and resets on every restart — fine for a demo, silent data loss in
      # production, which is why the service warns about it on boot.
      DATABASE_URL: ${DATABASE_URL:-}

      # Durable output + upload storage. Leave unset and everything stays on the
      # container's disk and dies with it. Any S3-compatible bucket works —
      # R2, B2, MinIO, S3 — via ORBIT_S3_ENDPOINT.
      ORBIT_S3_BUCKET: ${ORBIT_S3_BUCKET:-}
      ORBIT_S3_REGION: ${ORBIT_S3_REGION:-auto}
      ORBIT_S3_ENDPOINT: ${ORBIT_S3_ENDPOINT:-}
      ORBIT_S3_ACCESS_KEY_ID: ${ORBIT_S3_ACCESS_KEY_ID:-}
      ORBIT_S3_SECRET_ACCESS_KEY: ${ORBIT_S3_SECRET_ACCESS_KEY:-}
      ORBIT_S3_PUBLIC_BASE: ${ORBIT_S3_PUBLIC_BASE:-}

      # Encodes in flight, and how many may wait. The default cap of 2 assumes a
      # small box; ffmpeg will use every core it is given, so this wants to be
      # tuned to the container's CPU limit, not to the host's.
      ORBIT_MAX_CONCURRENT_RENDERS: ${ORBIT_MAX_CONCURRENT_RENDERS:-2}
      ORBIT_MAX_QUEUED_RENDERS: ${ORBIT_MAX_QUEUED_RENDERS:-8}

      # Generation providers. Absent, those routes report themselves unconfigured
      # rather than failing mid-request.
      RUNWAY_API_TOKEN: ${RUNWAY_API_TOKEN:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}

      # The language model behind /v1/generate. Any OpenAI-compatible
      # chat/completions endpoint; without all three the route reports itself
      # unconfigured and the worker does not start.
      ORBIT_LLM_BASE_URL: ${ORBIT_LLM_BASE_URL:-}
      ORBIT_LLM_MODEL: ${ORBIT_LLM_MODEL:-}
      ORBIT_LLM_API_KEY: ${ORBIT_LLM_API_KEY:-}
      ORBIT_LLM_JSON_MODE: ${ORBIT_LLM_JSON_MODE:-}
      ORBIT_LLM_TIMEOUT_MS: ${ORBIT_LLM_TIMEOUT_MS:-}
      # Stock footage. Unset, generation searches Openverse for CC0 stills,
      # which needs no key at all.
      PEXELS_API_KEY: ${PEXELS_API_KEY:-}
      # Set to 0 on a box that should accept generations but not run them.
      ORBIT_GENERATION_WORKER: ${ORBIT_GENERATION_WORKER:-}

      # What an export costs against the ledger. 0 leaves rendering unmetered,
      # which is the guest-first default the app is built around.
      ORBIT_RENDER_COST: ${ORBIT_RENDER_COST:-0}

      # What one generated video costs. Far more than a render, because it
      # spends real money at a language model, a TTS provider and a stock
      # search before the encoder ever runs. 0 leaves it unmetered.
      ORBIT_GENERATION_COST: ${ORBIT_GENERATION_COST:-0}

      # Stamped into /health so a running box can be identified. Set it in CI:
      #   ORBIT_BUILD_SHA=$(git rev-parse --short HEAD) docker compose up
      ORBIT_BUILD_SHA: ${ORBIT_BUILD_SHA:-}
    restart: unless-stopped
    # ffmpeg is happy to consume the whole machine. Without a limit one export
    # starves the process's own event loop and health checks start failing.
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g
